name: Publish to npm

on:
  # 在 main 分支有推送时自动触发
  release:
    types: [created]

  # 支持手动触发工作流
  workflow_dispatch:

# 关键：赋予工作流请求 OIDC 令牌的权限
permissions:
  contents: write # 用于打 tag 和创建 Release
  id-token: write # 用于 npm OIDC 可信发布

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # 这行配置告诉 npm 使用 OIDC 进行认证
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build the package
        run: npm run build

      - name: Publish to npm
        # 关键：加上 --provenance 标志，提供供应链安全证明
        run: npm publish --provenance --access public
