# 工作流名称
name: npm release

# 触发条件
on:
  # 当发布 Release 时触发
  release:
    types: [published]

  # 允许你从 GitHub Actions 页面手动触发
  workflow_dispatch:

# 为 GITHUB_TOKEN 设置权限，以便部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 确保同一时间只有一个部署任务在运行
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 如果启用了 VitePress 的 lastUpdated 功能，此设置可以获取完整的 Git 历史
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v6
        with:
          cache: npm # 如果使用 pnpm/yarn，请修改为相应名称
          cache-dependency-path: "package.json" # 不使用锁文件

      - name: 安装 Pages
        uses: actions/configure-pages@v6

      - name: 安装 dependencies
        run: npm install
        env:
          # 或者
          CI: "true" # CI 环境下 Husky 会自动跳过

      - name: Build
        run: npm run build # 或你项目定义的构建命令

      # 重要的地方：不要设置任何 NODE_AUTH_TOKEN 或 NPM_TOKEN 环境变量
      - name: Publish to npm
        run: npm publish
        # 环境变量部分必须完全移除，或者确保不包含 NODE_AUTH_TOKEN/NPM_TOKEN
