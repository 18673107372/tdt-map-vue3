name: Publish to npm

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    # 关键：添加 OIDC 所需的权限
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build

      # 重要的地方：不要设置任何 NODE_AUTH_TOKEN 或 NPM_TOKEN 环境变量
      - name: Publish to npm
        run: npm publish
        # 环境变量部分必须完全移除，或者确保不包含 NODE_AUTH_TOKEN/NPM_TOKEN
